name: Android validation
on:
  push:
    branches: [main, feature/iron-veil-v0.1.0]
    paths-ignore: [".github/workflows/toolchain.yml", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iron-veil-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validation utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep xvfb mesa-vulkan-drivers libvulkan1
      - uses: actions/cache@v4
        with:
          path: |
            .ci-tools/godot
            .ci-tools/templates
            .ci-tools/keys
          key: iron-veil-godot-4.6.2-linux-android-v1
      - name: Set up Godot
        run: bash tools/setup_godot.sh
      - name: Import assets and compile scripts
        run: |
          .ci-tools/godot/godot --headless --editor --import 2>&1 | tee build/import.log
          ! rg 'SCRIPT ERROR|Parse Error' build/import.log
      - name: Unit tests
        run: .ci-tools/godot/godot --headless res://tests/unit.tscn 2>&1 | tee build/unit.log
      - name: Integration tests
        run: |
          timeout 60 .ci-tools/godot/godot --headless -- --integration 2>&1 | tee build/integration.log
          ! rg 'SCRIPT ERROR|ERROR:' build/integration.log
      - name: Render and benchmark
        run: |
          xvfb-run -a timeout 100 .ci-tools/godot/godot --audio-driver Dummy -- --benchmark 2>&1 | tee build/benchmark.log
          cp benchmark-results.json capture-benchmark-*.png build/
          ! rg 'SCRIPT ERROR' build/benchmark.log
      - name: Export Android APK
        run: |
          .ci-tools/godot/godot --headless --export-debug Android build/IRON_VEIL_0.1.0.apk 2>&1 | tee build/export.log
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/IRON_VEIL_0.1.0.apk
          cd build
          sha256sum IRON_VEIL_0.1.0.apk > SHA256SUMS.txt
      - name: Source bundle
        run: git bundle create build/iron-veil-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: IRON_VEIL_0.1.0-Android
          path: build
          retention-days: 30
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, android-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: IRON_VEIL_0.1.0-Android
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: Android-runtime-validation
          path: validation
      - name: Publish tested Android vertical slice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then exit 0; fi
          gh release create v0.1.0 --target '${{ github.sha }}' --title 'IRON//VEIL v0.1.0' --prerelease --notes-file docs/RELEASE_NOTES.md build/IRON_VEIL_0.1.0.apk build/SHA256SUMS.txt build/benchmark-results.json build/capture-benchmark-*.png validation/android-*.png
  android-runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validation utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - uses: actions/download-artifact@v4
        with:
          name: IRON_VEIL_0.1.0-Android
          path: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/validate_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-runtime-validation
          path: |
            build/android-*.png
            build/android-logcat.txt
          retention-days: 30
