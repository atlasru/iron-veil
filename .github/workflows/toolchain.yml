name: Toolchain
on:
  push:
    paths: [".github/workflows/toolchain.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare renderer packages
        run: |
          sudo apt-get update -qq
          mkdir -p tools/debs
          cd tools/debs
          apt-get download libxkbfile1
      - uses: actions/upload-artifact@v4
        with:
          name: iron-veil-xkb
          path: tools
          retention-days: 3
